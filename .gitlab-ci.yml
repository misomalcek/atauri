stages:
  - build
  - deploy

variables:
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"

cache:
  paths:
    - .cargo/registry/
    - .cargo/git/
    - node_modules/

# ──────────────────────────────────────
# Build: Svelte frontend
# ──────────────────────────────────────

build-frontend:
  stage: build
  image: node:20-alpine
  script:
    - npm ci
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 hour

# ──────────────────────────────────────
# Build: Axum web binary for ARM64 Linux (VPS target)
# ──────────────────────────────────────

build-backend:
  stage: build
  image: rust:1.85-bookworm
  script:
    - apt-get update -qq && apt-get install -y -qq pkg-config libssl-dev gcc-aarch64-linux-gnu
    - rustup target add aarch64-unknown-linux-gnu
    - cargo build --release -p tauri-code-web --target aarch64-unknown-linux-gnu
  artifacts:
    paths:
      - target/aarch64-unknown-linux-gnu/release/tauri-code-web
    expire_in: 1 hour
  cache:
    paths:
      - .cargo/
      - target/

# ──────────────────────────────────────
# Deploy: rsync to VPS + restart service
# Runs only on main branch
# ──────────────────────────────────────

deploy:
  stage: deploy
  image: alpine:3.18
  needs:
    - build-frontend
    - build-backend
  only:
    - main
  before_script:
    - apk add --no-cache openssh-client rsync
    - eval $(ssh-agent -s)
    - echo "$VPS_SSH_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
  script:
    # Ensure deployment directory exists
    - ssh "$VPS_USER@$VPS_HOST" "mkdir -p /opt/tauri-code/dist"
    # Sync frontend build
    - rsync -az --delete dist/ "$VPS_USER@$VPS_HOST:/opt/tauri-code/dist/"
    # Copy binary
    - rsync -az target/aarch64-unknown-linux-gnu/release/tauri-code-web "$VPS_USER@$VPS_HOST:/opt/tauri-code/"
    - ssh "$VPS_USER@$VPS_HOST" "chmod +x /opt/tauri-code/tauri-code-web"
    # Restart service
    - ssh "$VPS_USER@$VPS_HOST" "systemctl restart tauri-code || true"

# ──────────────────────────────────────
# GitLab CI Variables (set in Settings > CI/CD > Variables):
#
# VPS_SSH_KEY  — private key contents (~/.ssh/claw), MASKED
# VPS_HOST     — 91.98.69.56
# VPS_USER     — m
# ──────────────────────────────────────
